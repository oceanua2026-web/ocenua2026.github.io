<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#06192d">
    <title>ОкеанUA - карта і меню</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css?v=20260607-7">
  </head>
  <body>
    <main class="map-app" aria-label="ОкеанUA">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Відкрити меню" aria-expanded="false" aria-controls="mainMenu">
        <span class="hamburger-lines" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <span class="map-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" focusable="false">
            <defs>
              <linearGradient id="mapBrandWaveA" x1="12" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#8cecff" />
                <stop offset=".48" stop-color="#1599ff" />
                <stop offset="1" stop-color="#0b3cbb" />
              </linearGradient>
              <linearGradient id="mapBrandWaveB" x1="16" y1="10" x2="50" y2="48" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#ffffff" />
                <stop offset="1" stop-color="#6fe2ff" />
              </linearGradient>
            </defs>
            <circle cx="32" cy="32" r="29" fill="#062a64" />
            <path d="M55 35c-3 13-15 22-29 19C12 51 4 37 9 24c5-14 20-22 35-15-13-1-25 7-28 18-2 9 4 18 14 20 8 1 16-3 20-10-8 5-19 2-22-6 9 7 20 1 27 4Z" fill="url(#mapBrandWaveA)" />
            <path d="M17 25c6-12 20-17 33-10-12 0-22 5-28 15-2-2-4-3-5-5Z" fill="url(#mapBrandWaveB)" opacity=".88" />
            <path d="M26 43c7 2 16-1 21-8-2 10-12 17-23 15-8-2-14-8-15-16 4 5 10 8 17 9Z" fill="#16d6ff" opacity=".72" />
          </svg>
        </span>
        <span class="map-brand-copy">
          <strong class="map-brand-name">Океан<span>UA</span></strong>
          <small>Освіта об'єднує нас</small>
        </span>
      </button>

      <button class="profile-entry" id="profileEntry" type="button" aria-label="Профіль або реєстрація">
        <span id="profileEntryText">Зареєструватися</span>
      </button>

      <section class="map-view" aria-label="Інтерактивна карта України">
        <div class="map-background" id="mapBackground" aria-hidden="true"></div>

        <div class="map-controls" id="mapControls" hidden>
          <button class="control-button" id="backButton" type="button">Назад</button>
          <button class="control-button" id="homeButton" type="button">Україна</button>
          <span class="view-title" id="viewTitle"></span>
        </div>

        <figure class="map-canvas" id="mapCanvas">
          <img id="mapImage" src="assets/maps/ukraine.png" alt="Карта України">
          <div class="hotspots-layer" id="hotspotsLayer"></div>
        </figure>

        <aside class="map-message" id="mapMessage" aria-live="polite" hidden></aside>
      </section>

      <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

      <aside class="main-menu" id="mainMenu" aria-hidden="true">
        <header class="menu-header">
          <div class="menu-panel-title">
            <strong>Меню</strong>
            <span id="profileStatus">Гість. Статистика не зберігається.</span>
          </div>
          <button class="close-menu" id="closeMenu" type="button" aria-label="Закрити меню">×</button>
        </header>

        <nav class="menu-list" id="menuList" aria-label="Основне меню"></nav>
      </aside>

      <section class="submenu-panel" id="menuContent" aria-live="polite" aria-hidden="true"></section>
    </main>

    <script src="data/nmt.js?v=20260607-4"></script>

    <script src="data/flashcards/grade-8.js?v=20260607"></script>
  <script src="data/flashcards/grade-9.js?v=20260607"></script>
  <script src="data/flashcards/grade-10.js?v=20260607-3"></script>
  <script src="data/flashcards/grade-12.js?v=20260607"></script>
  <script src="data/grade-flashcards.js?v=20260607-13"></script>
  <script src="data/python-flashcards.js?v=20260607"></script>

  </body>
</html>
